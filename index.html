<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA META TAGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050103">
    
    <title>CyberPink Christmas Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap');
      body {
        margin: 0;
        background-color: #050103;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      canvas { touch-action: none; }
      .loader {
        width: 48px; height: 48px;
        border: 5px solid #FFF; border-bottom-color: #FF69B4;
        border-radius: 50%; display: inline-block;
        animation: rotation 1s linear infinite;
      }
      @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber",
    "@react-three/postprocessing": "https://esm.sh/@react-three/postprocessing@2.16.0?external=react,three,@react-three/fiber,postprocessing",
    "postprocessing": "https://esm.sh/postprocessing@6.34.1?external=three",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.9"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef, useMemo, useCallback, Suspense } from 'react';
      import ReactDOM from 'react-dom/client';
      import * as THREE from 'three';
      import { Canvas, useFrame } from '@react-three/fiber';
      import { PerspectiveCamera, OrbitControls, Environment, Sparkles, Html, useProgress } from '@react-three/drei';
      import { EffectComposer, Bloom, Vignette } from '@react-three/postprocessing';
      import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

      // --- UTILS ---
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      const AppState = { TREE: 'TREE', EXPLODE: 'EXPLODE' };
      
      const COLORS = {
        bg: '#050103', leafPink1: '#FFB7C5', leafPink2: '#FF69B4',
        decoWhite: '#FFFFFF', decoPurple: '#E0B0FF', ribbon: '#FFFFFF',
      };

      // ULTRA-SAFE COUNTS FOR MOBILE
      const COUNTS = isMobile ? { leaves: 800, deco: 100, ribbon: 200, snow: 100 } 
                              : { leaves: 2200, deco: 350, ribbon: 800, snow: 600 };

      const TREE_CONFIG = { height: 18, baseRadius: 7, spiralLoops: 4 };
      const MUSIC_URL = "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Kevin_MacLeod/Jazz_Sampler/Kevin_MacLeod_-_Jingle_Bells.mp3";

      // --- MATH UTILS ---
      const getTreePosition = (ratio, angleOffset = 0) => {
        const y = (ratio * TREE_CONFIG.height) - (TREE_CONFIG.height / 2);
        const r = (1 - ratio) * TREE_CONFIG.baseRadius;
        const theta = Math.random() * Math.PI * 2 + angleOffset;
        const radiusRandom = Math.sqrt(Math.random()) * r;
        return [radiusRandom * Math.cos(theta), y, radiusRandom * Math.sin(theta)];
      };
      
      const getRibbonPosition = (i) => {
        const ratio = i / COUNTS.ribbon;
        const y = (ratio * TREE_CONFIG.height) - (TREE_CONFIG.height / 2);
        const r = ((1 - ratio) * TREE_CONFIG.baseRadius) + 0.5;
        const theta = ratio * Math.PI * 2 * TREE_CONFIG.spiralLoops;
        return [r * Math.cos(theta), y, r * Math.sin(theta)];
      };

      const getExplodePosition = () => {
        const r = 10 + Math.random() * 15;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        return [r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi)];
      };

      // --- COMPONENTS ---
      
      // 1. Error Boundary
      class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(error) { return { hasError: true, error }; }
        render() {
          if (this.state.hasError) {
            return (
              <div className="flex flex-col items-center justify-center h-screen bg-black text-pink-500 p-8 text-center">
                <h2 className="text-2xl font-bold mb-4">OPS! SOMETHING BROKE</h2>
                <p className="text-white text-sm opacity-70">{this.state.error?.message}</p>
                <button onClick={() => window.location.reload()} className="mt-8 px-6 py-2 border border-pink-500 rounded-full text-white">RELOAD</button>
              </div>
            );
          }
          return this.props.children;
        }
      }

      // 2. Safe Loader with Timeout
      const SafeLoader = () => {
        const { progress } = useProgress();
        const [show, setShow] = useState(true);
        
        // Force hide loader after 8 seconds to prevent getting stuck
        useEffect(() => {
          const timer = setTimeout(() => setShow(false), 8000);
          return () => clearTimeout(timer);
        }, []);

        if (!show && progress === 0) return null; // If forced hidden

        return (
          <Html center>
            <div className="flex flex-col items-center justify-center p-6 bg-black/90 rounded-2xl backdrop-blur-xl border border-pink-500/30 shadow-[0_0_50px_rgba(255,105,180,0.2)]">
              <span className="loader mb-4"></span>
              <div className="text-pink-400 font-bold tracking-widest text-sm text-center w-64">
                LOADING ASSETS... {Math.round(progress)}%
              </div>
              <div className="text-xs text-gray-500 mt-2">Mobile Optimized Mode</div>
            </div>
          </Html>
        );
      };

      const Snow = () => {
        const count = COUNTS.snow;
        const mesh = useRef(null);
        const dummy = useMemo(() => new THREE.Object3D(), []);
        const particles = useMemo(() => Array.from({ length: count }, () => ({
          x: (Math.random() - 0.5) * 70, y: Math.random() * 50 - 10, z: (Math.random() - 0.5) * 70,
          speed: 0.05 + Math.random() * 0.1, wobbleSpeed: 0.5 + Math.random(), wobbleOffset: Math.random() * Math.PI * 2,
          scale: 0.05 + Math.random() * 0.05
        })), []);

        useFrame((state) => {
          if (!mesh.current) return;
          const time = state.clock.getElapsedTime();
          particles.forEach((p, i) => {
            p.y -= p.speed;
            if (p.y < -15) { p.y = 35; p.x = (Math.random() - 0.5) * 70; p.z = (Math.random() - 0.5) * 70; }
            const wobble = Math.sin(time * p.wobbleSpeed + p.wobbleOffset) * 0.5;
            dummy.position.set(p.x + wobble, p.y, p.z);
            dummy.rotation.set(time * p.wobbleSpeed, time * p.wobbleSpeed, time * p.wobbleSpeed);
            dummy.scale.setScalar(p.scale);
            dummy.updateMatrix();
            mesh.current.setMatrixAt(i, dummy.matrix);
          });
          mesh.current.instanceMatrix.needsUpdate = true;
        });

        return (
          <instancedMesh ref={mesh} args={[undefined, undefined, count]}>
            <octahedronGeometry args={[1, 0]} />
            <meshBasicMaterial color={[1.5, 1.5, 1.5]} transparent opacity={0.8} depthWrite={false} toneMapped={false} />
          </instancedMesh>
        );
      };

      const Effects = () => (
        <EffectComposer disableNormalPass multisampling={0}>
          <Bloom intensity={1.2} luminanceThreshold={0.4} luminanceSmoothing={0.9} mipmapBlur={!isMobile} />
          <Vignette offset={0.5} darkness={0.6} />
        </EffectComposer>
      );

      const BreathingLights = () => {
        const spot = useRef(null), point = useRef(null), amb = useRef(null);
        useFrame(({ clock }) => {
          const t = clock.getElapsedTime();
          if (spot.current) spot.current.intensity = (2 + Math.sin(t * 2)) * 2;
          if (point.current) point.current.intensity = 2 + Math.sin(t * 2);
          if (amb.current) amb.current.intensity = 0.5 + Math.sin(t * 1.5) * 0.2;
        });
        return (
          <>
            <ambientLight ref={amb} intensity={0.5} color="#442233" />
            <spotLight ref={spot} position={[0, 15, -10]} angle={0.6} penumbra={1} intensity={5} color="#FF69B4" />
            <pointLight ref={point} position={[5, 0, 5]} intensity={2} color="#00FFFF" distance={40} />
          </>
        );
      };

      const Star = ({ appState }) => {
        const meshRef = useRef(null);
        const materialRef = useRef(null);
        
        const geometry = useMemo(() => {
          const shape = new THREE.Shape();
          const outerRadius = 0.8;
          const innerRadius = 0.4;
          const points = 5;

          for (let i = 0; i < points * 2; i++) {
            const angle = (i * Math.PI) / points;
            const radius = i % 2 === 0 ? outerRadius : innerRadius;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
          }
          shape.closePath();
          
          return new THREE.ExtrudeGeometry(shape, {
            steps: 1,
            depth: 0.2,
            bevelEnabled: true,
            bevelThickness: 0.1,
            bevelSize: 0.1,
            bevelSegments: 2
          });
        }, []);

        useFrame((state) => {
          if (!meshRef.current) return;
          const time = state.clock.getElapsedTime();
          meshRef.current.rotation.y = time * 0.5;
          meshRef.current.rotation.z = Math.sin(time * 2) * 0.1;
          
          // Shrink star when exploding, expand when tree
          const targetScale = appState === AppState.TREE ? 1.5 : 0.01; 
          meshRef.current.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);

          if (materialRef.current) {
              materialRef.current.emissiveIntensity = 2 + Math.sin(time * 3) * 1.5;
          }
        });

        return (
          <group position={[0, 9.5, 0]}>
            <mesh ref={meshRef} geometry={geometry}>
              <meshStandardMaterial 
                ref={materialRef}
                color="#FFFFE0" 
                emissive="#FFD700"
                emissiveIntensity={2}
                roughness={0.1}
                metalness={0.8}
              />
            </mesh>
            <Sparkles count={30} scale={4} size={6} speed={0.4} opacity={1} color="#FFFF00" />
            <pointLight distance={15} intensity={3} color="#FFD700" />
          </group>
        );
      };

      const ChristmasTree = ({ appState, rotationSpeed }) => {
        const leafRef = useRef(null), decoRef = useRef(null), ribRef = useRef(null);
        const dummy = useMemo(() => new THREE.Object3D(), []);
        
        const particles = useMemo(() => {
          const p = [];
          for (let i = 0; i < COUNTS.leaves; i++) p.push({ id: i, t: 'L', tree: getTreePosition(Math.random()), exp: getExplodePosition(), rot: [Math.random(), Math.random(), Math.random()], s: 0.12 + Math.random() * 0.1, c: Math.random() > 0.5 ? COLORS.leafPink1 : COLORS.leafPink2 });
          for (let i = 0; i < COUNTS.deco; i++) p.push({ id: i, t: 'D', tree: getTreePosition(Math.random()), exp: getExplodePosition(), rot: [Math.random(), Math.random(), Math.random()], s: 0.15 + Math.random() * 0.2, c: Math.random() > 0.6 ? COLORS.decoWhite : COLORS.decoPurple });
          for (let i = 0; i < COUNTS.ribbon; i++) p.push({ id: i, t: 'R', tree: getRibbonPosition(i), exp: getExplodePosition(), rot: [1, 1, 1], s: 0.08, c: COLORS.ribbon });
          return p;
        }, []);

        useEffect(() => {
          if (!leafRef.current) return;
          let li = 0, di = 0, ri = 0;
          particles.forEach(p => {
            const c = new THREE.Color(p.c);
            if (p.t === 'L') leafRef.current.setColorAt(li++, c);
            else if (p.t === 'D') decoRef.current.setColorAt(di++, c);
            else ribRef.current.setColorAt(ri++, c);
          });
          leafRef.current.instanceColor.needsUpdate = true;
          decoRef.current.instanceColor.needsUpdate = true;
          ribRef.current.instanceColor.needsUpdate = true;
        }, []);

        const prog = useRef(1);
        useFrame((state, delta) => {
          const isTree = appState === AppState.TREE;
          prog.current = THREE.MathUtils.damp(prog.current, isTree ? 1 : 0, 2.5, delta);
          const t = prog.current;
          const et = state.clock.getElapsedTime();
          const autoRot = et * 0.1 + rotationSpeed * 5;
          
          let li = 0, di = 0, ri = 0;
          particles.forEach(p => {
            const x = THREE.MathUtils.lerp(p.exp[0], p.tree[0], t);
            const y = THREE.MathUtils.lerp(p.exp[1], p.tree[1], t);
            const z = THREE.MathUtils.lerp(p.exp[2], p.tree[2], t);
            dummy.position.set(x, y, z);
            
            const baseS = THREE.MathUtils.lerp(0.01, p.s, t);
            const breath = isTree ? (1 + Math.sin(et * 2 + p.id) * 0.1) : (0.6 + Math.sin(et + p.id) * 0.2);
            dummy.scale.setScalar(baseS * breath);
            
            dummy.rotation.set(et * p.rot[0], et * p.rot[1], et * p.rot[2]);
            dummy.updateMatrix();
            
            if (p.t === 'L') leafRef.current.setMatrixAt(li++, dummy.matrix);
            else if (p.t === 'D') decoRef.current.setMatrixAt(di++, dummy.matrix);
            else ribRef.current.setMatrixAt(ri++, dummy.matrix);
          });

          leafRef.current.instanceMatrix.needsUpdate = true;
          decoRef.current.instanceMatrix.needsUpdate = true;
          ribRef.current.instanceMatrix.needsUpdate = true;
          
          leafRef.current.rotation.y = decoRef.current.rotation.y = ribRef.current.rotation.y = autoRot;
        });

        return (
          <group>
            <instancedMesh ref={leafRef} args={[undefined, undefined, COUNTS.leaves]}><octahedronGeometry args={[1, 0]} /><meshStandardMaterial metalness={0.6} roughness={0.3} /></instancedMesh>
            <instancedMesh ref={decoRef} args={[undefined, undefined, COUNTS.deco]}><icosahedronGeometry args={[1, 0]} /><meshPhysicalMaterial metalness={0.9} roughness={0.1} /></instancedMesh>
            <instancedMesh ref={ribRef} args={[undefined, undefined, COUNTS.ribbon]}><tetrahedronGeometry args={[1, 0]} /><meshBasicMaterial toneMapped={false} /></instancedMesh>
          </group>
        );
      };

      // Isolate Environment to prevent blocking
      const AsyncEnvironment = () => (
        <Suspense fallback={null}>
          <Environment preset="city" />
        </Suspense>
      );

      const Scene = ({ appState, gestureRotation }) => (
        <>
          <PerspectiveCamera makeDefault position={[0, 2, 28]} fov={45} />
          <OrbitControls enablePan={false} minDistance={10} maxDistance={50} autoRotate={false} />
          <BreathingLights />
          <pointLight position={[10, 10, 10]} intensity={1} color="#FF00FF" distance={50} />
          <pointLight position={[-10, 5, -10]} intensity={1} color="#00FFFF" distance={50} />
          <Snow />
          <Sparkles count={isMobile ? 30 : 100} scale={[25, 25, 25]} size={4} speed={0.3} opacity={0.5} color="#FFB7C5" />
          <group position={[0, -7, 0]}>
            <ChristmasTree appState={appState} rotationSpeed={gestureRotation} />
            <Star appState={appState} />
          </group>
          <Effects />
          <AsyncEnvironment />
          <fog attach="fog" args={['#050103', 15, 60]} />
        </>
      );

      const AudioController = () => {
        const [playing, setPlaying] = useState(false);
        const audioRef = useRef(null);
        
        const initAudio = () => {
          if (!audioRef.current) {
            audioRef.current = new Audio(MUSIC_URL);
            audioRef.current.loop = true;
            audioRef.current.volume = 0.5;
          }
        };

        const togglePlay = (e) => {
          e.stopPropagation();
          initAudio();
          if (playing) audioRef.current.pause(); 
          else audioRef.current.play().catch(console.error);
          setPlaying(!playing);
        };

        useEffect(() => {
          const oneTimeInit = () => { initAudio(); window.removeEventListener('click', oneTimeInit); };
          window.addEventListener('click', oneTimeInit);
          return () => { 
            window.removeEventListener('click', oneTimeInit);
            if(audioRef.current) audioRef.current.pause(); 
          };
        }, []);

        return (
          <button onClick={togglePlay} className={`fixed top-4 right-4 z-50 p-3 rounded-full backdrop-blur-md border transition-all duration-300 ${playing ? 'bg-pink-500/30 border-pink-400 text-pink-100' : 'bg-black/30 border-gray-600 text-gray-400'}`}>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              {playing ? <><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></> : <><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></>}
            </svg>
          </button>
        );
      };

      const AIController = ({ onGestureUpdate, onStatusChange }) => {
        const videoRef = useRef(null);
        const [active, setActive] = useState(false);
        const [loading, setLoading] = useState(false);

        const startAI = async () => {
          if (loading || active) return;
          setLoading(true);
          onStatusChange("INITIALIZING AI...");
          
          try {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm");
            const handLandmarker = await HandLandmarker.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                delegate: "GPU"
              },
              runningMode: "VIDEO", numHands: 1
            });
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 } });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.onloadeddata = () => {
                setLoading(false);
                setActive(true);
                onStatusChange("AI READY");
                predictLoop(handLandmarker, videoRef.current);
              };
            }
          } catch (e) {
            console.error(e);
            setLoading(false);
            onStatusChange("AI FAILED: " + e.message);
            alert("Camera failed or denied. Use touch instead.");
          }
        };

        const predictLoop = (landmarker, video) => {
          let lastTime = -1;
          const loop = () => {
            if (video && video.currentTime !== lastTime) {
              lastTime = video.currentTime;
              const result = landmarker.detectForVideo(video, performance.now());
              if (result.landmarks?.[0]) {
                const lm = result.landmarks[0];
                const thumb = lm[4], index = lm[8], wrist = lm[0], pinky = lm[20];
                const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
                const isPinching = dist(thumb, index) < 0.05;
                const isOpen = dist(wrist, index) > 0.3 && dist(wrist, pinky) > 0.3;
                
                onGestureUpdate({ detected: true, isPinching, isOpen, handX: 1 - lm[9].x });
              } else {
                onGestureUpdate({ detected: false });
              }
            }
            requestAnimationFrame(loop);
          };
          loop();
        };

        if (!active) {
          return (
            <button onClick={startAI} disabled={loading} className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-pink-600/80 text-white px-6 py-2 rounded-full backdrop-blur font-bold border border-pink-400 shadow-lg active:scale-95 transition-transform">
              {loading ? "DOWNLOADING AI..." : "✋ ENABLE HAND CONTROL"}
            </button>
          );
        }

        return <video ref={videoRef} autoPlay playsInline muted className="fixed bottom-4 right-4 w-24 h-18 opacity-50 rounded border border-pink-500 z-40" />;
      };

      const App = () => {
        const [appState, setAppState] = useState(AppState.TREE);
        const [gestureRotation, setGestureRotation] = useState(0);
        const [aiStatus, setAiStatus] = useState("");
        const [isGestureActive, setIsGestureActive] = useState(false);

        const handleGesture = useCallback((g) => {
          setIsGestureActive(g.detected);
          if (!g.detected) return;
          if (g.isPinching) setAppState(AppState.TREE);
          else if (g.isOpen) {
            setAppState(AppState.EXPLODE);
            setGestureRotation(r => r + (g.handX - 0.5) * 0.1);
          }
        }, []);

        return (
          <ErrorBoundary>
            <div className="w-full h-screen bg-[#050103] text-white relative overflow-hidden">
              <AudioController />
              
              <div className="absolute inset-0 z-0" onClick={() => setAppState(s => s === AppState.TREE ? AppState.EXPLODE : AppState.TREE)}>
                <Canvas dpr={[1, isMobile ? 1.5 : 2]} gl={{ antialias: false }}>
                  <Suspense fallback={<SafeLoader />}>
                    <Scene appState={appState} gestureRotation={gestureRotation} />
                  </Suspense>
                </Canvas>
              </div>

              <div className="absolute top-0 left-0 p-6 z-10 pointer-events-none">
                <h1 className="text-4xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 drop-shadow-[0_0_10px_rgba(255,105,180,0.5)]">
                  CYBER<span className="text-white font-light">XMAS</span>
                </h1>
                <p className="mt-1 text-pink-200/50 text-xs tracking-widest">Lite Edition v2.0</p>
              </div>

              <div className="absolute bottom-6 left-6 z-10 pointer-events-none text-xs text-gray-400">
                <p className="text-pink-500 font-bold mb-1">{aiStatus}</p>
                <p>TAP SCREEN • PINCH TO ASSEMBLE</p>
              </div>

              <AIController onGestureUpdate={handleGesture} onStatusChange={setAiStatus} />
              
              {isGestureActive && (
                <div className="absolute inset-0 pointer-events-none z-20 flex items-center justify-center">
                  <div className="text-pink-500/10 text-[80px] font-bold tracking-widest animate-pulse">AI ACTIVE</div>
                </div>
              )}
            </div>
          </ErrorBoundary>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App /></React.StrictMode>);
    </script>
  </body>
</html>
