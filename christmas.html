<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA OPTIMIZATION: Prevent scaling and ensure native app feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA META TAGS: This makes it look like a real app when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050103">
    <meta name="application-name" content="CyberPink Christmas">
    <meta name="apple-mobile-web-app-title" content="CyberPink Xmas">
    
    <!-- APP ICON: Placeholder icon for home screen (Pink Snowflake) -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/6215/6215038.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/6215/6215038.png">

    <title>CyberPink Christmas Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap');
      body {
        margin: 0;
        background-color: #050103;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
        -webkit-tap-highlight-color: transparent; /* Remove tap highlight on iOS */
        -webkit-user-select: none; /* Disable text selection */
        user-select: none;
      }
      canvas {
        touch-action: none;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #111; }
      ::-webkit-scrollbar-thumb { background: #ff69b4; }

      /* Loader Animation */
      .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #FFF;
        border-bottom-color: #FF69B4;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }
      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "three": "https://esm.sh/three@^0.182.0",
    "three/": "https://esm.sh/three@^0.182.0/",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.4.2?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7?external=react,react-dom,three,@react-three/fiber",
    "@react-three/postprocessing": "https://esm.sh/@react-three/postprocessing@^3.0.4?external=react,three,@react-three/fiber,postprocessing",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@^0.10.22-rc.20250304",
    "postprocessing": "https://esm.sh/postprocessing@^6.38.0?external=three",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react,typescript">
      import React, { useState, useEffect, useRef, useMemo, useCallback, Suspense } from 'react';
      import ReactDOM from 'react-dom/client';
      import * as THREE from 'three';
      import { Canvas, useFrame, useThree } from '@react-three/fiber';
      import { PerspectiveCamera, OrbitControls, Environment, Sparkles, Html, useProgress } from '@react-three/drei';
      import { EffectComposer, Bloom, Vignette } from '@react-three/postprocessing';
      import { KernelSize, Resolution } from 'postprocessing';
      import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

      // --- UTILS: Mobile Detection ---
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // --- TYPES ---
      const AppState = {
        TREE: 'TREE',
        EXPLODE: 'EXPLODE',
      };

      // --- CONSTANTS ---
      const COLORS = {
        bg: '#050103',
        leafPink1: '#FFB7C5',
        leafPink2: '#FF69B4',
        decoWhite: '#FFFFFF',
        decoPurple: '#E0B0FF',
        ribbon: '#FFFFFF',
      };

      // OPTIMIZATION: Reduce counts on mobile to prevent crashes
      const COUNTS = isMobile ? {
        leaves: 1000, 
        deco: 150,     
        ribbon: 300,
        snow: 200
      } : {
        leaves: 2200,  
        deco: 350,     
        ribbon: 800, 
        snow: 600  
      };

      const TREE_CONFIG = {
        height: 18,
        baseRadius: 7,
        spiralLoops: 4,
      };

      const MUSIC_URL = "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Kevin_MacLeod/Jazz_Sampler/Kevin_MacLeod_-_Jingle_Bells.mp3";

      // --- UTILS ---
      const getTreePosition = (ratio, angleOffset = 0) => {
        const y = (ratio * TREE_CONFIG.height) - (TREE_CONFIG.height / 2);
        const r = (1 - ratio) * TREE_CONFIG.baseRadius;
        const theta = Math.random() * Math.PI * 2 + angleOffset;
        const radiusRandom = Math.sqrt(Math.random()) * r;
        const x = radiusRandom * Math.cos(theta);
        const z = radiusRandom * Math.sin(theta);
        return [x, y, z];
      };

      const getRibbonPosition = (i) => {
        const ratio = i / COUNTS.ribbon;
        const y = (ratio * TREE_CONFIG.height) - (TREE_CONFIG.height / 2);
        const r = ((1 - ratio) * TREE_CONFIG.baseRadius) + 0.5;
        const theta = ratio * Math.PI * 2 * TREE_CONFIG.spiralLoops;
        const x = r * Math.cos(theta);
        const z = r * Math.sin(theta);
        return [x, y, z];
      };

      const getExplodePosition = () => {
        const r = 10 + Math.random() * 15;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);
        return [x, y, z];
      };

      // --- COMPONENTS ---

      const Loader = () => {
        const { progress } = useProgress();
        return (
          <Html center>
            <div className="flex flex-col items-center justify-center p-4 bg-black/80 rounded-xl backdrop-blur-md border border-pink-500/30">
              <span className="loader mb-4"></span>
              <div className="text-pink-400 font-bold tracking-widest text-sm text-center w-48">
                LOADING CHRISTMAS MAGIC... {Math.round(progress)}%
              </div>
            </div>
          </Html>
        );
      };

      const Snow = () => {
        const count = COUNTS.snow; 
        const mesh = useRef(null);
        const dummy = useMemo(() => new THREE.Object3D(), []);

        const particles = useMemo(() => {
          const temp = [];
          for (let i = 0; i < count; i++) {
            temp.push({
              x: (Math.random() - 0.5) * 70,
              y: Math.random() * 50 - 10,
              z: (Math.random() - 0.5) * 70,
              speed: 0.08 + Math.random() * 0.15,
              wobbleSpeed: 0.5 + Math.random() * 1.5,
              wobbleOffset: Math.random() * Math.PI * 2,
              scale: 0.05 + Math.random() * 0.08
            });
          }
          return temp;
        }, []);

        useFrame((state) => {
          if (!mesh.current) return;
          const time = state.clock.getElapsedTime();
          particles.forEach((p, i) => {
            p.y -= p.speed;
            if (p.y < -15) {
              p.y = 35;
              p.x = (Math.random() - 0.5) * 70;
              p.z = (Math.random() - 0.5) * 70;
            }
            const wobble = Math.sin(time * p.wobbleSpeed + p.wobbleOffset) * 0.5;
            dummy.position.set(p.x + wobble, p.y, p.z);
            dummy.rotation.x = time * p.wobbleSpeed;
            dummy.rotation.z = time * p.wobbleSpeed;
            dummy.scale.setScalar(p.scale);
            dummy.updateMatrix();
            mesh.current.setMatrixAt(i, dummy.matrix);
          });
          mesh.current.instanceMatrix.needsUpdate = true;
        });

        return (
          <instancedMesh ref={mesh} args={[undefined, undefined, count]}>
            <octahedronGeometry args={[1, 0]} />
            <meshBasicMaterial 
              color={[1.5, 1.5, 1.5]} 
              transparent 
              opacity={0.9}           
              depthWrite={false}
              toneMapped={false}      
            />
          </instancedMesh>
        );
      };

      const Effects = () => {
        // Reduced quality settings for mobile to prevent crashes
        return (
          <EffectComposer disableNormalPass multisampling={isMobile ? 0 : 4}>
            <Bloom 
              intensity={1.5} 
              luminanceThreshold={0.3} 
              luminanceSmoothing={0.9} 
              kernelSize={isMobile ? KernelSize.VERY_SMALL : KernelSize.SMALL} 
              mipmapBlur={!isMobile} 
            />
            <Vignette offset={0.5} darkness={0.6} eskil={false} />
          </EffectComposer>
        );
      };

      const BreathingLights = () => {
        const spotLightRef = useRef(null);
        const pointLightRef = useRef(null);
        const ambientRef = useRef(null);

        useFrame(({ clock }) => {
          const time = clock.getElapsedTime();
          const breathingIntensity = 2 + Math.sin(time * 2) * 1; 
          const subtleBreathing = 0.5 + Math.sin(time * 1.5) * 0.2; 
          
          if (spotLightRef.current) spotLightRef.current.intensity = breathingIntensity * 2;
          if (pointLightRef.current) pointLightRef.current.intensity = breathingIntensity;
          if (ambientRef.current) ambientRef.current.intensity = subtleBreathing;
        });

        return (
          <>
             <ambientLight ref={ambientRef} intensity={0.5} color="#442233" />
             <spotLight ref={spotLightRef} position={[0, 15, -10]} angle={0.6} penumbra={1} intensity={5} color="#FF69B4" />
            <pointLight ref={pointLightRef} position={[5, 0, 5]} intensity={2} color="#00FFFF" distance={40} />
          </>
        );
      };

      const Star = ({ appState }) => {
        const meshRef = useRef(null);
        const materialRef = useRef(null);
        
        const geometry = useMemo(() => {
          const shape = new THREE.Shape();
          const outerRadius = 0.8;
          const innerRadius = 0.4;
          const points = 5;
          for (let i = 0; i < points * 2; i++) {
            const angle = (i * Math.PI) / points;
            const radius = i % 2 === 0 ? outerRadius : innerRadius;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
          }
          shape.closePath();
          return new THREE.ExtrudeGeometry(shape, { steps: 1, depth: 0.2, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 2 });
        }, []);

        useFrame((state) => {
          if (!meshRef.current) return;
          const time = state.clock.getElapsedTime();
          meshRef.current.rotation.y = time * 0.5;
          meshRef.current.rotation.z = Math.sin(time * 2) * 0.1;
          const targetScale = appState === AppState.TREE ? 1.5 : 0.01; 
          meshRef.current.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
          if (materialRef.current) materialRef.current.emissiveIntensity = 2 + Math.sin(time * 3) * 1.5;
        });

        return (
          <group position={[0, 9.5, 0]}>
            <mesh ref={meshRef} geometry={geometry}>
              <meshStandardMaterial ref={materialRef} color="#FFFFE0" emissive="#FFD700" emissiveIntensity={2} roughness={0.1} metalness={0.8} />
            </mesh>
            <Sparkles count={30} scale={4} size={6} speed={0.4} opacity={1} color="#FFFF00" />
            <pointLight distance={15} intensity={3} color="#FFD700" />
          </group>
        );
      };

      const ChristmasTree = ({ appState, rotationSpeed }) => {
        const leafMeshRef = useRef(null);
        const decoMeshRef = useRef(null);
        const ribbonMeshRef = useRef(null);
        const dummy = useMemo(() => new THREE.Object3D(), []);

        const particles = useMemo(() => {
          const data = [];
          for (let i = 0; i < COUNTS.leaves; i++) {
            data.push({
              id: i,
              initialPos: [0, 0, 0],
              treePos: getTreePosition(Math.random()),
              explodePos: getExplodePosition(),
              rotationSpeed: [(Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2],
              scale: 0.12 + Math.random() * 0.1,
              color: Math.random() > 0.5 ? COLORS.leafPink1 : COLORS.leafPink2,
              type: 'LEAF'
            });
          }
          for (let i = 0; i < COUNTS.deco; i++) {
            data.push({
              id: i + COUNTS.leaves,
              initialPos: [0, 0, 0],
              treePos: getTreePosition(Math.random(), 0),
              explodePos: getExplodePosition(),
              rotationSpeed: [Math.random(), Math.random(), Math.random()],
              scale: 0.15 + Math.random() * 0.2, 
              color: Math.random() > 0.6 ? COLORS.decoWhite : COLORS.decoPurple,
              type: 'DECO'
            });
          }
          for (let i = 0; i < COUNTS.ribbon; i++) {
            data.push({
              id: i + COUNTS.leaves + COUNTS.deco,
              initialPos: [0, 0, 0],
              treePos: getRibbonPosition(i),
              explodePos: getExplodePosition(),
              rotationSpeed: [1, 1, 1],
              scale: 0.08, 
              color: COLORS.ribbon,
              type: 'RIBBON'
            });
          }
          return data;
        }, []);

        useEffect(() => {
          if (!leafMeshRef.current || !decoMeshRef.current || !ribbonMeshRef.current) return;
          let leafIdx = 0, decoIdx = 0, ribbonIdx = 0;
          particles.forEach((p) => {
            const color = new THREE.Color(p.color);
            if (p.type === 'LEAF') leafMeshRef.current.setColorAt(leafIdx++, color);
            else if (p.type === 'DECO') decoMeshRef.current.setColorAt(decoIdx++, color);
            else if (p.type === 'RIBBON') ribbonMeshRef.current.setColorAt(ribbonIdx++, color);
          });
          leafMeshRef.current.instanceColor.needsUpdate = true;
          decoMeshRef.current.instanceColor.needsUpdate = true;
          ribbonMeshRef.current.instanceColor.needsUpdate = true;
        }, [particles]);
        
        const progress = useRef(1);

        useFrame((state, delta) => {
          const isTree = appState === AppState.TREE;
          const target = isTree ? 1 : 0;
          progress.current = THREE.MathUtils.damp(progress.current, target, 2.5, delta);
          const t = progress.current;
          const autoRotate = state.clock.getElapsedTime() * 0.1;
          const elapsedTime = state.clock.getElapsedTime();
          let leafIdx = 0, decoIdx = 0, ribbonIdx = 0;

          particles.forEach((p) => {
            const x = THREE.MathUtils.lerp(p.explodePos[0], p.treePos[0], t);
            const y = THREE.MathUtils.lerp(p.explodePos[1], p.treePos[1], t);
            const z = THREE.MathUtils.lerp(p.explodePos[2], p.treePos[2], t);
            dummy.position.set(x, y, z);
            const scale = THREE.MathUtils.lerp(0.01, p.scale, t); 
            const breathingScale = isTree ? scale * (1 + Math.sin(elapsedTime * 2 + p.id) * 0.1) : scale;
            const actualScale = isTree ? breathingScale : p.scale * (0.6 + Math.sin(elapsedTime + p.id) * 0.2);
            dummy.scale.set(actualScale, actualScale, actualScale);
            dummy.rotation.x = elapsedTime * p.rotationSpeed[0];
            dummy.rotation.y = elapsedTime * p.rotationSpeed[1];
            dummy.rotation.z = elapsedTime * p.rotationSpeed[2];
            dummy.updateMatrix();
            if (p.type === 'LEAF') leafMeshRef.current.setMatrixAt(leafIdx++, dummy.matrix);
            else if (p.type === 'DECO') decoMeshRef.current.setMatrixAt(decoIdx++, dummy.matrix);
            else if (p.type === 'RIBBON') ribbonMeshRef.current.setMatrixAt(ribbonIdx++, dummy.matrix);
          });

          if (leafMeshRef.current) leafMeshRef.current.instanceMatrix.needsUpdate = true;
          if (decoMeshRef.current) decoMeshRef.current.instanceMatrix.needsUpdate = true;
          if (ribbonMeshRef.current) ribbonMeshRef.current.instanceMatrix.needsUpdate = true;

          const groupRotation = autoRotate + (rotationSpeed * 5); 
          if (leafMeshRef.current) leafMeshRef.current.rotation.y = groupRotation;
          if (decoMeshRef.current) decoMeshRef.current.rotation.y = groupRotation;
          if (ribbonMeshRef.current) ribbonMeshRef.current.rotation.y = groupRotation;
        });

        return (
          <group>
            <instancedMesh ref={leafMeshRef} args={[undefined, undefined, COUNTS.leaves]}>
              <octahedronGeometry args={[1, 0]} />
              <meshStandardMaterial metalness={0.6} roughness={0.3} color="#FFB7C5" />
            </instancedMesh>
            <instancedMesh ref={decoMeshRef} args={[undefined, undefined, COUNTS.deco]}>
              <icosahedronGeometry args={[1, 0]} />
              <meshPhysicalMaterial metalness={0.9} roughness={0.1} envMapIntensity={2} clearcoat={1} color="#FFFFFF" emissive="#FF69B4" emissiveIntensity={0.5} />
            </instancedMesh>
            <instancedMesh ref={ribbonMeshRef} args={[undefined, undefined, COUNTS.ribbon]}>
              <tetrahedronGeometry args={[1, 0]} />
              <meshBasicMaterial color="#FFFFFF" toneMapped={false} />
            </instancedMesh>
          </group>
        );
      };

      const Scene = ({ appState, gestureRotation }) => {
        const controlsRef = useRef(null);
        return (
          <>
            <PerspectiveCamera makeDefault position={[0, 2, 28]} fov={45} />
            <OrbitControls ref={controlsRef} enablePan={false} enableZoom={true} minDistance={10} maxDistance={50} enableRotate={true} autoRotate={false} />
            <BreathingLights />
            <pointLight position={[10, 10, 10]} intensity={1} color="#FF00FF" distance={50} />
            <pointLight position={[-10, 5, -10]} intensity={1} color="#00FFFF" distance={50} />
            <Snow />
            <Sparkles count={isMobile ? 50 : 150} scale={[25, 25, 25]} size={4} speed={0.3} opacity={0.5} color="#FFB7C5" />
            <Sparkles count={isMobile ? 30 : 80} scale={[30, 30, 30]} size={2} speed={0.2} opacity={0.3} color="#A020F0" />
            <group position={[0, -7, 0]}>
              <ChristmasTree appState={appState} rotationSpeed={gestureRotation} />
              <Star appState={appState} />
            </group>
            <Effects />
            <Environment preset="city" />
            <fog attach="fog" args={['#050103', 15, 60]} />
          </>
        );
      };

      const AudioController = () => {
        const [playing, setPlaying] = useState(false);
        const [volume, setVolume] = useState(0.5);
        const audioRef = useRef(null);

        useEffect(() => {
          audioRef.current = new Audio(MUSIC_URL);
          audioRef.current.loop = true;
          audioRef.current.volume = volume;
          
          const handleFirstInteraction = () => {
            if (audioRef.current && audioRef.current.paused) {
                const playPromise = audioRef.current.play();
                if (playPromise !== undefined) {
                  playPromise.then(() => setPlaying(true)).catch(e => console.log("Autoplay prevented:", e));
                }
            }
            window.removeEventListener('click', handleFirstInteraction);
            window.removeEventListener('touchstart', handleFirstInteraction);
            window.removeEventListener('keydown', handleFirstInteraction);
          };
          window.addEventListener('click', handleFirstInteraction);
          window.addEventListener('touchstart', handleFirstInteraction);
          window.addEventListener('keydown', handleFirstInteraction);
          return () => {
            if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
            window.removeEventListener('click', handleFirstInteraction);
            window.removeEventListener('touchstart', handleFirstInteraction);
            window.removeEventListener('keydown', handleFirstInteraction);
          };
        }, []);

        const togglePlay = (e) => {
          e.stopPropagation();
          if (!audioRef.current) return;
          if (playing) audioRef.current.pause(); else audioRef.current.play().catch(e => console.log(e));
          setPlaying(!playing);
        };

        return (
          <button onClick={togglePlay} className={`fixed top-4 right-4 z-50 p-3 rounded-full backdrop-blur-md border transition-all duration-300 ${playing ? 'bg-pink-500/30 border-pink-400 text-pink-100 shadow-[0_0_15px_rgba(255,105,180,0.5)]' : 'bg-black/30 border-gray-600 text-gray-400'}`}>
            {playing ? <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> : <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>}
            <span className="sr-only">Toggle Music</span>
          </button>
        );
      };

      const GestureController = ({ onGestureUpdate }) => {
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const [loaded, setLoaded] = useState(false);
        const [error, setError] = useState(null);
        const lastPredictionTime = useRef(0);
        const PREDICTION_INTERVAL = 100;

        useEffect(() => {
          // SAFE GUARD: Check for camera support immediately
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setError("Camera unavailable (Use Touch)");
            return;
          }

          let handLandmarker = null;
          let animationFrameId;

          const setupMediaPipe = async () => {
            try {
              const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
              );
              handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                  modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                  delegate: isMobile ? "CPU" : "GPU" // Use CPU on mobile for stability
                },
                runningMode: "VIDEO",
                numHands: 1
              });
              setLoaded(true);
              startCamera();
            } catch (err) {
              console.error(err);
              setError("AI Load Failed");
            }
          };

          const startCamera = async () => {
            if (!videoRef.current) return;
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 320, height: 240, facingMode: 'user' } 
              });
              videoRef.current.srcObject = stream;
              videoRef.current.addEventListener('loadeddata', predictWebcam);
            } catch (err) {
              setError("Camera Blocked");
            }
          };

          const predictWebcam = () => {
            if (!handLandmarker || !videoRef.current || !canvasRef.current) return;
            const now = performance.now();
            if (now - lastPredictionTime.current < PREDICTION_INTERVAL) {
               animationFrameId = requestAnimationFrame(predictWebcam);
               return;
            }
            lastPredictionTime.current = now;

            const video = videoRef.current;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            const startTimeMs = performance.now();
            const results = handLandmarker.detectForVideo(video, startTimeMs);

            let gesture = { isPinching: false, isOpen: false, handX: 0.5, detected: false };

            if (results.landmarks && results.landmarks.length > 0) {
              const landmarks = results.landmarks[0];
              ctx.fillStyle = '#FF69B4';
              for (const point of landmarks) {
                const x = (1 - point.x) * canvas.width;
                const y = point.y * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 2 * Math.PI);
                ctx.fill();
              }
              const thumbTip = landmarks[4];
              const indexTip = landmarks[8];
              const wrist = landmarks[0];
              const pinky = landmarks[20];
              const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
              const pinchDist = dist(thumbTip, indexTip);
              const wristIndexDist = dist(wrist, indexTip);
              const wristPinkyDist = dist(wrist, pinky);

              gesture.handX = 1 - landmarks[9].x;
              gesture.detected = true;
              if (pinchDist < 0.05) gesture.isPinching = true;
              else if (wristIndexDist > 0.3 && wristPinkyDist > 0.3) gesture.isOpen = true;
            }
            onGestureUpdate(gesture);
            animationFrameId = requestAnimationFrame(predictWebcam);
          };
          setupMediaPipe();
          return () => {
            if (videoRef.current && videoRef.current.srcObject) {
              videoRef.current.srcObject.getTracks().forEach(t => t.stop());
            }
            cancelAnimationFrame(animationFrameId);
            if (handLandmarker) handLandmarker.close();
          };
        }, [onGestureUpdate]);

        return (
          <div className="fixed bottom-4 right-4 z-50 flex flex-col items-end pointer-events-none">
            <div className="bg-black/80 border border-pink-500/30 p-2 rounded-lg backdrop-blur-sm shadow-[0_0_20px_rgba(255,105,180,0.3)]">
              {error ? (
                <div className="text-red-400 text-xs">{error}</div>
              ) : !loaded ? (
                <div className="text-pink-300 text-xs animate-pulse">Initializing AI Vision...</div>
              ) : (
                <div className="relative">
                  <video ref={videoRef} className="hidden" autoPlay playsInline muted />
                  <canvas ref={canvasRef} className="w-32 h-24 rounded border border-pink-500/20" />
                  <div className="absolute top-1 left-1 text-[10px] text-pink-500 font-bold tracking-widest bg-black/50 px-1 rounded">LIVE FEED</div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const App = () => {
        const [appState, setAppState] = useState(AppState.TREE);
        const [gestureRotation, setGestureRotation] = useState(0);
        const [isGestureActive, setIsGestureActive] = useState(false);
        const [debugInfo, setDebugInfo] = useState("");

        const toggleState = () => setAppState((prev) => (prev === AppState.TREE ? AppState.EXPLODE : AppState.TREE));

        const handleGestureUpdate = useCallback((gesture) => {
          setIsGestureActive(gesture.detected);
          if (!gesture.detected) return;
          if (gesture.isPinching) {
            setAppState(AppState.TREE);
            setDebugInfo("GESTURE: PINCH");
          } else if (gesture.isOpen) {
            setAppState(AppState.EXPLODE);
            setDebugInfo("GESTURE: OPEN");
          } else {
            setDebugInfo("GESTURE: TRACKING");
          }
          if (gesture.isOpen) {
              const delta = (gesture.handX - 0.5) * 0.1;
              setGestureRotation((prev) => prev + delta);
          }
        }, []);

        return (
          <div className="w-full h-screen bg-[#050103] text-white relative overflow-hidden select-none">
            <AudioController />
            <div className="absolute inset-0 z-0" onClick={toggleState}>
              <Canvas dpr={[1, isMobile ? 1.5 : 2]} gl={{ antialias: false, powerPreference: "default" }}>
                <Suspense fallback={<Loader />}>
                  <Scene appState={appState} gestureRotation={gestureRotation} />
                </Suspense>
              </Canvas>
            </div>
            <div className="absolute top-0 left-0 p-8 z-10 pointer-events-none">
              <h1 className="text-5xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 drop-shadow-[0_0_10px_rgba(255,105,180,0.5)]">
                CYBER<span className="text-white font-light">XMAS</span>
              </h1>
              <p className="mt-2 text-pink-200/70 text-sm tracking-widest uppercase">Mobile Optimized</p>
            </div>
            <div className="absolute bottom-8 left-8 z-10 pointer-events-none text-xs text-gray-500 max-w-xs">
              <p className="mb-1 text-pink-500 font-bold">{debugInfo}</p>
              <p className="font-bold text-white text-base">TAP SCREEN TO START MUSIC</p>
              <p>TAP SCREEN or USE HAND GESTURES</p>
            </div>
            <GestureController onGestureUpdate={handleGestureUpdate} />
            {isGestureActive && (
              <div className="absolute inset-0 pointer-events-none z-20 flex items-center justify-center">
                  <div className="text-pink-500/20 text-[100px] animate-pulse font-bold tracking-widest">AI ACTIVE</div>
              </div>
            )}
          </div>
        );
      };

      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<React.StrictMode><App /></React.StrictMode>);
      }
    </script>
  </body>
</html>
